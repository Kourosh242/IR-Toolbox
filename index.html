      <h1>IR-Toolbox — جعبه ابزار آفلاین فارسی | Offline-First Web Toolbox (PWA)</h1>
      <p>IR-Toolbox (جعبه ابزار IR) یک وب‌اپلیکیشن رایگان، متن‌باز (MIT) و کاملاً آفلاین است با ۵۲ ابزار کاربردی فارسی در ۹ دسته. همه پردازش‌ها روی دستگاه شما انجام می‌شود؛ هیچ داده‌ای به سرور ارسال نمی‌شود.</p>
      <h2>دسته‌بندی ابزارها</h2>
      <ul>
        <li>📝 متن: جست‌وجو/جایگزینی، شمارنده، اسلاگ‌ساز، پاک‌سازی متن</li>
        <li>💻 توسعه‌دهنده: JSON، Base64، CSV ↔ JSON، Timestamp، مترجم Cron</li>
        <li>🎨 طراحی: رنگ‌ساز، کنتراست، لورم فارسی</li>
        <li>📁 فایل: بررسی هش، Base64 ← فایل، Data URL</li>
        <li>🧮 محاسبات: ماشین‌حساب علمی، درصد، تبدیل واحد، BMI</li>
        <li>⏰ زمان: تقویم شمسی، محاسبه سن، پومودورو، کرنومتر</li>
        <li>🔐 امنیت: گاوصندوق IR (AES-256-GCM)، مدیر رمز عبور، رمزساز، QR‌خوان با بررسی ایمنی لینک</li>
        <li>🎉 سرگرمی و 🧠 بازی فکری</li>
      </ul>
      <p>نصب به‌عنوان اپلیکیشن (PWA) و کار کامل بدون اینترنت. مخزن سورس: <a href="https://github.com/Kourosh242/IR-Toolbox">GitHub — Kourosh242/IR-Toolbox</a></p>
