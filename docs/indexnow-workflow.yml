# IndexNow — پینگ خودکار موتورهای جستجو هنگام هر آپدیت محتوا
#
# چرا؟ موتورهای جستجوی بسیاری (از جمله جستجوی چت‌بات‌های هوش مصنوعی مثل
# ChatGPT Search) به ایندکس Bing متکی‌اند و IndexNow سریع‌ترین راه برای
# خبر دادن به آن‌هاست. کلید در secrets مخزن (INDEXNOW_KEY) نگهداری می‌شود
# و باید با محتوای فایل <key>.txt در ریشه‌ی سایت یکسان باشد.
#
# مسیر کلید: https://kourosh242.github.io/IR-Toolbox/<key>.txt
name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'llms.txt'
      - 'sitemap.xml'
      - 'README.md'
      - 'about/**'
      - 'tools/**/index.html'
  workflow_dispatch:

jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: sleep 120

      # فهرست آدرس‌ها از خودِ sitemap.xml خوانده می‌شود، نه دستی.
      # این‌طور با اضافه‌شدن هر ابزار/صفحهٔ جدید، پینگ هم خودکار کامل می‌شود.
      - name: Build URL list from sitemap.xml
        id: urls
        run: |
          python3 - <<'PY' > /tmp/urllist.json
          import re, json
          xml = open('sitemap.xml', encoding='utf-8').read()
          urls = re.findall(r'<loc>(.*?)</loc>', xml)
          # IndexNow حداکثر ۱۰٬۰۰۰ آدرس در هر درخواست می‌پذیرد؛ ۵۰۰ تا سقف امن است
          print(json.dumps(urls[:500]))
          PY
          echo "آدرس‌های جمع‌شده: $(python3 -c "import json;print(len(json.load(open('/tmp/urllist.json'))))")"
          cat /tmp/urllist.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Ping IndexNow API
        env:
          # ترجیحاً از Secret مخزن استفاده می‌شود؛ در نبودِ آن، همان کلیدِ
          # نیمه‌عمومیِ فایل <key>.txt (که طبق مشخصات IndexNow باید عمومی سرو شود)
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || 'f73c3a4984e3d77b8b0f146423a09ab4' }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::کلید IndexNow در دسترس نیست — پینگ انجام نشد."
            exit 0
          fi
          PAYLOAD=$(python3 - "$INDEXNOW_KEY" <<'PY'
          import json, sys
          key = sys.argv[1]
          urls = json.load(open('/tmp/urllist.json'))
          print(json.dumps({
            "host": "kourosh242.github.io",
            "key": key,
            "keyLocation": f"https://kourosh242.github.io/IR-Toolbox/{key}.txt",
            "urlList": urls,
          }))
          PY
          )
          RESPONSE=$(curl -sS -o /tmp/indexnow-response.txt -w "%{http_code}" -X POST \
            "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")
          echo "IndexNow HTTP status: $RESPONSE"
          cat /tmp/indexnow-response.txt || true
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "202" ]; then
            echo "::warning::پینگ IndexNow با کد $RESPONSE برگشت (کلید/فایل کلید را بررسی کنید)"
          else
            echo "✅ آدرس‌های سایت با موفقیت به موتورهای جستجو اعلام شد."
          fi
