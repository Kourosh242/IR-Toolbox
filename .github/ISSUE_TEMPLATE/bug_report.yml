name: 🐞 گزارش باگ (Bug report)
description: مشکلی در یکی از ابزارها یا خود اپ دیدید
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ممنون از گزارش شما! 🙏 لطفاً اطلاعات زیر را کامل پر کنید تا سریع‌تر رفع شود.
  - type: textarea
    id: what-happened
    attributes:
      label: چه اتفاقی افتاد؟ (What happened?)
      description: رفتار مورد انتظار در مقابل رفتار واقعی + مراحل بازتولید
      placeholder: |
        1. ابزار «...» را باز می‌کنم
        2. ... می‌کنم
        3. به‌جای ... این اتفاق می‌افتد
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: کدام بخش؟ (Which area?)
      options:
        - ابزار مشخص (یک ابزار خاص)
        - متن (Text)
        - توسعه‌دهنده (Developer)
        - طراحی (Design)
        - فایل (Files)
        - محاسبات (Math)
        - زمان (Time)
        - امنیت / گاوصندوق (Security / Vault)
        - سرگرمی / بازی فکری (Fun / Brain)
        - PWA / نصب / آفلاین
        - ظاهر و پوسته (UI / Theme)
        - سایر (Other)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: نسخه (Version)
      placeholder: v1.3.7
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: مرورگر و سیستم‌عامل (Browser & OS)
      placeholder: Chrome 128 / Android 14
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: بررسی‌ها (Checks)
      options:
        - label: در آخرین نسخه آنلاین هم تست کردم (https://kourosh242.github.io/IR-Toolbox/)
          required: true
        - label: Issue مشابهی قبلاً باز نشده است
          required: true
